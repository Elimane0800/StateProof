services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: stateproof
      POSTGRES_PASSWORD: stateproof
      POSTGRES_DB: stateproof
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stateproof -d stateproof"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      # Repo root context so agents/, config/ and demo/ are in the image.
      context: .
      dockerfile: Dockerfile
    environment:
      # psycopg v3 scheme (bare postgresql:// is auto-rewritten in code too).
      DATABASE_URL: postgresql+psycopg://stateproof:stateproof@db:5432/stateproof
      UPLOADS_DIR: /app/backend/var/uploads
      MAX_UPLOAD_MB: "200"
      ALLOWED_VIDEO_EXT: ".mp4,.mov,.webm"
      # Live inspection (ARIA pipeline) — required. Interpolated from the
      # repo-root .env by docker compose.
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      NVIDIA_MODEL: ${NVIDIA_MODEL:-meta/llama-3.2-90b-vision-instruct}
      CORS_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173"
    ports:
      - "8000:8080"
    volumes:
      # Persist audits, artifacts and uploaded videos on the host.
      - ./backend/var:/app/backend/var
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
